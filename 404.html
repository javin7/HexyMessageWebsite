<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | BEST LIFE 和熙元</title>
  <meta name="theme-color" content="#a67a4e">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-page-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      background: var(--dark-bg);
      color: #ffffff;
    }
    .error-card {
      background: var(--dark-surface);
      border: 1px solid var(--dark-border);
      border-left: 4px solid var(--primary);
      padding: 4rem 3rem;
      max-width: 600px;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: 5rem;
      font-weight: 700;
      color: var(--primary-light);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="heading-md" style="color:#ffffff; margin-bottom:1rem;">Page Not Found</h1>
      <p style="color:var(--dark-muted); margin-bottom:2.5rem; font-size:1.05rem;">
        The sanctuary page you are looking for does not exist or has been relocated.
      </p>
      <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
        <a href="/" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Return Home
        </a>
        <a href="/#booking" class="btn btn-outline-light">
          <i class="fa-regular fa-calendar-check"></i> Book Appointment
        </a>
      </div>
    </div>
  </div>
</body>
</html>
